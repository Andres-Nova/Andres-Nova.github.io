name: Mantener demos activos

# Abre cada demo con un navegador Chromium headless real (Playwright) para
# establecer la conexión WebSocket que Streamlit Cloud cuenta como actividad.
# Si el demo está dormido, clica el botón de despertar y espera a que cargue.

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:          # permite ejecución manual desde la pestaña Actions

jobs:
  despertar:
    name: Despertar demos Streamlit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Despertar demos
        run: python .github/scripts/despertar_demos.py
